name: Build

on:
  # Tags are built by release.yml.
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texinfo wget

      - name: Cache Arm GNU Toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/bmlisa/toolchains
          key: arm-gnu-toolchain-15.2.rel1-arm-none-eabi-aarch64-none-elf

      # IDLE is compiled as C++, where a function that falls off its end
      # without returning a value lets GCC drop code (0.1.0 hung on the Pi):
      # the PC simulator, built here with GCC, makes that an error.
      - name: IDLE's return values (PC simulator, GCC)
        run: make -s -C tools/hostsim -j"$(nproc)" IDLE_CFLAGS="-x c++ -Werror=return-type"

      - name: Build
        run: ./build_sdcard.sh

      - name: Upload SD card files
        uses: actions/upload-artifact@v7
        with:
          name: bmlisa-sdcard
          path: build/sdcard/
